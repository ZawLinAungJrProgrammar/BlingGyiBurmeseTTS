name: Setup Android Directories and Move Files

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  setup-dirs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Directories and Organize Files
        run: |
          # ၁။ လိုအပ်သော Android ဖိုဒါလမ်းကြောင်းများ အားလုံးကို ဖန်တီးခြင်း
          mkdir -p app/src/main/java/com/blindgyi/tts
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p .github/workflows

          # ၂။ ပင်မ Gradle နှင့် Manifest ဖိုင်များကို နေရာချခြင်း
          [ -f "settings.gradle" ] && mv settings.gradle ./
          [ -f "build.gradle" ] && mv build.gradle ./
          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/

          # ၃။ App-level build.gradle နာမည်အမျိုးမျိုးဖြင့် ပါလာပါက နေရာချခြင်း
          if [ -f "App build.gridle" ]; then
            mv "App build.gridle" app/build.gradle
          elif [ -f "App build.gradle" ]; then
            mv "App build.gradle" app/build.gradle
          elif [ -f "Appbuild.gradle" ]; then
            mv "Appbuild.gradle" app/build.gradle
          elif [ -f "app build.gradle" ]; then
            mv "app build.gradle" app/build.gradle
          fi

          # ၄။ Java ကုဒ်ဖိုင်များကို နေရာချခြင်း
          find . -maxdepth 1 -name "*.java" -exec mv {} app/src/main/java/com/blindgyi/tts/ \;

          # ၅။ C++ နှင့် Header ဖိုင်များကို နေရာချခြင်း
          find . -maxdepth 1 \( -name "*.cpp" -o -name "*.h" -o -name "CMakeLists.txt" \) -exec mv {} app/src/main/cpp/ \;

          # ၆။ .so ဖိုင်များကို Architecture အလိုက် 32-bit (v7a) နှင့် 64-bit (v8a) ခွဲထုတ်ခြင်း
          for f in *.so; do
            if [ -f "$f" ]; then
              if echo "$f" | grep -qiE "v7a|armeabi"; then
                mv "$f" app/src/main/jniLibs/armeabi-v7a/
              else
                mv "$f" app/src/main/jniLibs/arm64-v8a/
              fi
            fi
          done

          # ၇။ XML ဖိုင်များကို res/xml သို့ ရွှေ့ခြင်း
          find . -maxdepth 1 -name "*.xml" ! -name "AndroidManifest.xml" -exec mv {} app/src/main/res/xml/ \;

          # အပြောင်းအလဲများကို GitHub သို့ သိမ်းဆည်းရန်
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Setup Android directories and organize files"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:${{ github.ref_name }}
          fi

